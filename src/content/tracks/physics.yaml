letter: A
order: 1
title: 물리학
subtitle: 장·대칭·통일
question: 장(field)이 무엇이고, 대칭이 왜 상호작용을 결정하며, 통일은 어느 수준까지 실제로 이루어졌는가?
summary: 학부 수학을 장이론의 언어로 번역하는 속성 과정에서 시작해 고전 장이론, 장의 양자화, 게이지 이론과 표준모형, 대통일이론, 양자중력 후보까지 이어진다. 도달점은 게이지 이론 교과서를 혼자 읽고 관련 arXiv 논문의 논지를 따라가는 상태다.
assumes:
  - 다변수 미적분
  - 선형대수
  - 양자역학 1년
  - 특수상대론
