# 예전 배포 대상. 현재 프로덕션은 Cloudflare Pages(deploy-cloudflare.yml)이며,
# 두 곳이 동시에 배포되면 같은 내용이 두 주소에 올라가므로 자동 실행을 껐다.
# GitHub Pages 로 돌아가려면 아래 on: 에 push 트리거를 다시 추가한다.
name: Deploy to GitHub Pages (manual)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 프로젝트 사이트(https://<user>.github.io/UFT). 커스텀 도메인으로 옮기면 SITE_URL 을 바꾸고 BASE_PATH 를 / 로.
  SITE_URL: https://junlee915-star.github.io
  BASE_PATH: /UFT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
