<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fdfcfa"/>
  <rect x="0" y="0" width="1200" height="10" fill="#2f5d8a"/>
  <rect x="400" y="0" width="400" height="10" fill="#8a6320"/>
  <rect x="800" y="0" width="400" height="10" fill="#6b4d8a"/>
  <text x="100" y="180" font-size="58" font-family="sans-serif" font-weight="bold" fill="#1c1917">통일장이론 교육과정</text>
  <text x="100" y="240" font-size="30" font-family="sans-serif" fill="#57534e">물리학 · 종교철학 · 통합, 세 트랙으로 배우는 한국어 커리큘럼</text>
  <g font-family="sans-serif">
    <rect x="100" y="300" width="300" height="180" rx="14" fill="none" stroke="#2f5d8a" stroke-width="2"/>
    <text x="124" y="340" font-size="20" font-weight="bold" fill="#2f5d8a">트랙 A</text>
    <text x="124" y="378" font-size="28" font-weight="bold" fill="#1c1917">물리학</text>
    <text x="124" y="416" font-size="19" fill="#57534e">고전 장이론에서</text>
    <text x="124" y="446" font-size="19" fill="#57534e">양자중력까지</text>
    <rect x="450" y="300" width="300" height="180" rx="14" fill="none" stroke="#8a6320" stroke-width="2"/>
    <text x="474" y="340" font-size="20" font-weight="bold" fill="#8a6320">트랙 B</text>
    <text x="474" y="378" font-size="28" font-weight="bold" fill="#1c1917">종교·철학</text>
    <text x="474" y="416" font-size="19" fill="#57534e">방법론에서</text>
    <text x="474" y="446" font-size="19" fill="#57534e">의식·정보까지</text>
    <rect x="800" y="300" width="300" height="180" rx="14" fill="none" stroke="#6b4d8a" stroke-width="2"/>
    <text x="824" y="340" font-size="20" font-weight="bold" fill="#6b4d8a">트랙 C</text>
    <text x="824" y="378" font-size="28" font-weight="bold" fill="#1c1917">통합</text>
    <text x="824" y="416" font-size="19" fill="#57534e">검증 가능한</text>
    <text x="824" y="446" font-size="19" fill="#57534e">명제로 진술하기</text>
  </g>
  <text x="100" y="556" font-size="26" font-family="Georgia, serif" fill="#2f5d8a">∮ 𝓛 = −¼ F₍μν₎ Fᵘᵛ + ψ̄(iγᵘD₍μ₎ − m)ψ</text>
</svg>
